# One command: docker compose up
x-app: &app                      # our services share one image; each runs a different command
  build: .
  image: governed-agents:local   # one tag for every service, incl. the cli profile, so one build updates them all
  volumes:
    - ./.keys:/app/.keys         # stub issuer's key pair (never baked into the image)
    - ./audit:/app/audit         # one shared audit log
    - ./evals/results:/app/evals/results   # eval result files survive the throwaway cli container

services:
  gateway:                       # model gateway: the only place that knows about providers
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/gateway/litellm.yaml", "--port", "4000"]
    volumes: ["./gateway:/app/gateway:ro"]   # the folder, not the file: editors that save by replacing the file would leave a file mount stale
    env_file: [{path: .env, required: false}]   # keys from .env; gateway is unauthenticated (local demo only)
    ports: ["127.0.0.1:4400:4000"]   # host port 4400: 4000 is often taken on Windows

  dataproducts:                  # governed data: badge checked at the door
    <<: *app
    command: ["uvicorn", "dataproducts.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]

  skill-context:                 # MCP skill get_instrument_context (T2)
    <<: *app
    command: ["python", "-m", "skills.instrument_context"]
    environment: {DATA_URL: "http://dataproducts:8001"}
    ports: ["127.0.0.1:8101:8101"]

  skill-manuals:                 # MCP skill search_manuals (T1)
    <<: *app
    command: ["python", "-m", "skills.manuals"]
    environment: {DATA_URL: "http://dataproducts:8001"}
    ports: ["127.0.0.1:8102:8102"]

  cli:                           # docker compose run --rm cli python -m cli ask yusuf "…"
    <<: *app
    profiles: [cli]
    depends_on: [gateway, skill-context, skill-manuals, skill-parts]
    environment:
      GATEWAY_URL: "http://gateway:4000"
      SKILL_CONTEXT_URL: "http://skill-context:8101/mcp"
      SKILL_MANUALS_URL: "http://skill-manuals:8102/mcp"
      SKILL_PARTS_URL: "http://skill-parts:8103/mcp"
      SKILL_PARTS_RC_URL: "http://skill-parts-rc:8113/mcp"   # demo eval rc
      SCHEDULING_URL: "http://scheduling-agent:8201/"

  scheduling-agent:              # Field Ops' agent behind A2A (deterministic, no LLM)
    <<: *app
    command: ["python", "-m", "agents.scheduling.agent"]
    environment: {DATA_URL: "http://dataproducts:8001", SCHEDULING_PUBLIC_URL: "http://scheduling-agent:8201/"}
    ports: ["127.0.0.1:8201:8201"]

  skill-parts:                   # MCP skill propose_parts_order (T3)
    <<: *app
    command: ["python", "-m", "skills.parts"]
    environment: {DATA_URL: "http://dataproducts:8001"}
    ports: ["127.0.0.1:8103:8103"]

  skill-parts-rc:                # sandbox build of the same skill, v0.4 with the deliberate regression (SC7)
    <<: *app
    command: ["python", "-m", "skills.parts"]
    environment: {DATA_URL: "http://dataproducts:8001", PARTS_SKILL_VERSION: "0.4", PORT: "8113"}
    ports: ["127.0.0.1:8113:8113"]
