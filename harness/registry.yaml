# Registry of skills and agents. Tiers are computed from manifests (R-RSK-1) — nobody declares them.
# `certified_tier` is kept in step with the promotion decisions by hand: `demo eval` records CERTIFIED or BLOCKED
# in the audit log (R-CRT-1) but does not write this file. In production the promotion step writes it
# (docs/PATH_TO_PRODUCTION.md), so certification is the only way to raise a tier.
# An agent may only call what its manifest lists, and only up to its certified tier (R-RSK-3).
agents:
  triage-agent:
    owner: service-pod
    version: "1.0"
    manifest: [get_instrument_context, search_manuals, propose_parts_order, propose_visit]
    certified_tier: 3
  quick-lookup:                     # Consuelo's composition (SC5)
    owner: consuelo
    version: "0.2-draft"
    manifest: [get_instrument_context, search_manuals, propose_parts_order]   # she just added the ordering skill
    certified_tier: 2               # certified when the manifest was [get_instrument_context, search_manuals]
  scheduling-agent:
    owner: field-ops
    version: "1.0"
    manifest: [propose_visit]
    certified_tier: 3
